<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Acceso - Reportes de Ventas</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:Arial,sans-serif; background:linear-gradient(135deg,#2c3e50,#34495e); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:15px; }
        .card { background:white; border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,0.3); padding:30px 25px; width:100%; max-width:380px; }
        .card h1 { text-align:center; color:#2c3e50; font-size:1.4em; margin-bottom:25px; }
        label { display:block; margin-bottom:6px; font-weight:bold; color:#2c3e50; font-size:14px; }
        input { width:100%; padding:12px; margin-bottom:15px; border:2px solid #bdc3c7; border-radius:5px; font-size:16px; }
        input:focus { outline:none; border-color:#3498db; }
        button { width:100%; padding:13px; background:#3498db; color:white; border:none; border-radius:5px; font-size:16px; font-weight:bold; cursor:pointer; margin-top:5px; }
        button:hover { background:#2980b9; }
        button:disabled { background:#95a5a6; cursor:not-allowed; }
        .recordar { display:flex; align-items:center; gap:8px; margin:-5px 0 15px; font-size:14px; color:#2c3e50; cursor:pointer; user-select:none; }
        .recordar input { width:18px; height:18px; margin:0; cursor:pointer; }
        .error-msg { background:#fdecea; color:#c0392b; padding:10px; border-radius:5px; font-size:14px; margin-bottom:15px; display:none; }
        .menu-card { display:none; }
        .menu-card h1 { margin-bottom:5px; }
        .saludo { text-align:center; color:#7f8c8d; margin-bottom:25px; font-size:14px; }
        .menu-item { display:block; width:100%; padding:16px; margin-bottom:12px; background:#ecf0f1; border:2px solid #bdc3c7; border-radius:8px; text-decoration:none; color:#2c3e50; font-weight:bold; font-size:15px; text-align:center; transition:background 0.2s; }
        .menu-item:hover { background:#3498db; color:white; border-color:#3498db; }
        .menu-item .icon { font-size:1.3em; display:block; margin-bottom:5px; }
        .btn-salir { display:block; width:100%; padding:12px; margin-top:10px; background:none; border:2px solid #e74c3c; color:#e74c3c; border-radius:8px; font-weight:bold; font-size:14px; cursor:pointer; text-align:center; }
        .btn-salir:hover { background:#e74c3c; color:white; }
    </style>
</head>
<body>
<div class="card" id="loginCard">
    <h1>🔒 Acceso a Reportes</h1>
    <div id="errorMsg" class="error-msg"></div>
    <label for="servidor">Servidor:</label>
    <input type="text" id="servidor" placeholder="Número de servidor" inputmode="numeric" maxlength="10" autocomplete="off">
    <label for="username">Usuario:</label>
    <input type="text" id="username" placeholder="Tu usuario" autocomplete="off">
    <label for="password">Contraseña:</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="off">
    <label class="recordar"><input type="checkbox" id="recordar"> Recordar servidor y usuario en este dispositivo</label>
    <button id="loginBtn">Entrar</button>
</div>

<div class="card menu-card" id="menuCard">
    <h1>📊 Reportes de Ventas</h1>
    <p class="saludo" id="saludo">Bienvenido</p>
    <div id="menuLinks"></div>
    <button class="btn-salir" id="btnSalir">🚪 Salir</button>
</div>

<script>
const WORKER_URL = 'https://frosty-base-53ff.watsonmraul.workers.dev';
// Los reportes históricos (Excel en GitHub) solo existen para este servidor
const SERVIDOR_HISTORICOS = '041';
const ITEM_SERVIDORES = { icon:'🖥️', label:'Servidores', file:'servidores.html' };

const MENUS_POR_ROL = {
    general: [
        { icon:'🗂️', label:'Reportes Históricos', file:'historicos.html' },
        { icon:'📝', label:'Captura de Ventas', file:'captura_ventas.html' },
        { icon:'📊', label:'Reporte Mensual (Sistema Nuevo)', file:'reporte_bd.html', extraParams:'tipo=mensual' },
        { icon:'📅', label:'Reporte Diario (Sistema Nuevo)', file:'reporte_bd.html', extraParams:'tipo=diario' },
        { icon:'📆', label:'Reporte por Rango de Fechas', file:'reporte_bd.html', extraParams:'tipo=rango' },
        { icon:'📈', label:'Gráfico de Ventas', file:'reporte_grafico.html' },
        { icon:'💰', label:'Reporte de Ganancias del Día', file:'reporte_ganancias.html' },
        { icon:'🏦', label:'Cuentas con la Banca', file:'cta_banca_general.html' },
        { icon:'⚙️', label:'Configuraciones', file:'configuraciones.html' }
    ],
    superadmin: [
        { icon:'🗂️', label:'Reportes Históricos', file:'historicos.html' },
        { icon:'📝', label:'Captura de Ventas', file:'captura_ventas.html' },
        { icon:'📊', label:'Reporte Mensual (Sistema Nuevo)', file:'reporte_bd.html', extraParams:'tipo=mensual' },
        { icon:'📅', label:'Reporte Diario (Sistema Nuevo)', file:'reporte_bd.html', extraParams:'tipo=diario' },
        { icon:'📆', label:'Reporte por Rango de Fechas', file:'reporte_bd.html', extraParams:'tipo=rango' },
        { icon:'📈', label:'Gráfico de Ventas', file:'reporte_grafico.html' },
        { icon:'💰', label:'Reporte de Ganancias del Día', file:'reporte_ganancias.html' },
        { icon:'🏦', label:'Cuentas con la Banca', file:'cta_banca_general.html' },
        { icon:'⚙️', label:'Configuraciones', file:'configuraciones.html' }
    ],
    vendedor: [
        { icon:'🗂️', label:'Reportes Históricos', file:'historicos.html' },
        { icon:'📊', label:'Reporte Mensual (Sistema Nuevo)', file:'reporte_bd.html', extraParams:'tipo=mensual' },
        { icon:'📅', label:'Reporte Diario (Sistema Nuevo)', file:'reporte_bd.html', extraParams:'tipo=diario' },
        { icon:'📆', label:'Reporte por Rango de Fechas', file:'reporte_bd.html', extraParams:'tipo=rango' },
        { icon:'📈', label:'Gráfico de Ventas', file:'reporte_grafico.html' }
    ],
    captura: [
        { icon:'📝', label:'Captura de Ventas', file:'captura_ventas.html' }
    ]
};

function getSession() {
    try { const s = sessionStorage.getItem('rt_session'); return s ? JSON.parse(s) : null; } catch(e) { return null; }
}
function setSession(data) { sessionStorage.setItem('rt_session', JSON.stringify(data)); }
function clearSession() { sessionStorage.removeItem('rt_session'); }

const loginCard = document.getElementById('loginCard');
const menuCard = document.getElementById('menuCard');
const errorMsg = document.getElementById('errorMsg');
const loginBtn = document.getElementById('loginBtn');

function showError(text) { errorMsg.textContent = text; errorMsg.style.display = 'block'; }
function hideError() { errorMsg.style.display = 'none'; }

function menuPara(session) {
    // Superusuario sin servidor: solo administra servidores
    if (session.role === 'superadmin' && !session.servidor) return [ITEM_SERVIDORES];
    let items = MENUS_POR_ROL[session.role];
    if (!items) return null;
    if (session.servidor !== SERVIDOR_HISTORICOS) items = items.filter(i => i.file !== 'historicos.html');
    if (session.role === 'superadmin') items = [ITEM_SERVIDORES].concat(items);
    return items;
}

function mostrarMenu(session) {
    const menuItems = menuPara(session);
    if (!menuItems) { showError('⚠️ Tu usuario no tiene un rol de reportes asignado'); return; }
    const menuLinksEl = document.getElementById('menuLinks');
    menuLinksEl.innerHTML = '';
    menuItems.forEach(item => {
        let href = item.file;
        if (item.extraParams) href += '?' + item.extraParams;
        const a = document.createElement('a');
        a.href = href;
        a.className = 'menu-item';
        a.innerHTML = `<span class="icon">${item.icon}</span>${item.label}`;
        menuLinksEl.appendChild(a);
    });
    document.getElementById('saludo').textContent = session.servidor
        ? `Bienvenido, ${session.username} · Servidor ${session.servidor}`
        : `Bienvenido, ${session.username} · Superusuario`;
    loginCard.style.display = 'none';
    menuCard.style.display = 'block';
}

async function attemptLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const servidor = document.getElementById('servidor').value.trim();
    if (!username || !password) { showError('⚠️ Ingresa usuario y contraseña'); return; }
    hideError();
    loginBtn.disabled = true;
    loginBtn.textContent = 'Verificando...';
    try {
        const response = await fetch(WORKER_URL + '/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password, servidor })
        });
        const data = await response.json();
        if (response.ok && data.ok) {
            setSession({ token: data.token, role: data.role, vendedor: data.vendedor, username: data.username, servidor: data.servidor || null });
            guardarRecordado(servidor, username);
            mostrarMenu(data);
        } else if (response.status === 401) {
            showError('⚠️ Usuario, contraseña o servidor incorrectos');
        } else {
            showError('⚠️ ' + (data.error || 'Error al iniciar sesión'));
        }
    } catch (error) {
        showError('⚠️ Error de conexión: ' + error.message);
    } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Entrar';
    }
}

document.getElementById('btnSalir').addEventListener('click', async function() {
    const s = getSession();
    if (s && s.token) {
        try { await fetch(WORKER_URL + '/api/logout', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token: s.token }) }); } catch(e) {}
    }
    clearSession();
    loginCard.style.display = 'block';
    menuCard.style.display = 'none';
    document.getElementById('servidor').value = '';
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
    document.getElementById('recordar').checked = false;
    cargarRecordado();
});

loginBtn.addEventListener('click', attemptLogin);
document.getElementById('password').addEventListener('keypress', e => { if (e.key === 'Enter') attemptLogin(); });
document.getElementById('username').addEventListener('keypress', e => { if (e.key === 'Enter') attemptLogin(); });
document.getElementById('servidor').addEventListener('keypress', e => { if (e.key === 'Enter') attemptLogin(); });

// Recordar el último servidor usado en este teléfono/computadora
// "Recordar servidor y usuario": se guarda solo en este dispositivo (nunca la contraseña)
const CLAVE_RECORDAR = 'rt_recordar_login';
function guardarRecordado(servidor, username) {
    try {
        if (document.getElementById('recordar').checked) localStorage.setItem(CLAVE_RECORDAR, JSON.stringify({ servidor, username }));
        else localStorage.removeItem(CLAVE_RECORDAR);
        localStorage.removeItem('rt_ultimo_servidor'); // clave vieja, ya no se usa
    } catch(e) {}
}
function cargarRecordado() {
    try {
        const guardado = JSON.parse(localStorage.getItem(CLAVE_RECORDAR) || 'null');
        if (!guardado) return;
        document.getElementById('servidor').value = guardado.servidor || '';
        document.getElementById('username').value = guardado.username || '';
        document.getElementById('recordar').checked = true;
        document.getElementById('password').focus();
    } catch(e) {}
}
cargarRecordado();

// Si ya hay sesión activa (del sistema con servidores), mostrar el menú directamente
const sesionActiva = getSession();
if (sesionActiva && sesionActiva.token && ('servidor' in sesionActiva)) mostrarMenu(sesionActiva);
else clearSession();
</script>
</body>
</html>
